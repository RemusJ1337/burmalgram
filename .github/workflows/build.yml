name: Build Burmalgram

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '1'

      - name: Restore Bazel Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /Users/Shared/bazel-cache
            /Users/Shared/bazel-repo-cache
          key: bazel-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            echo "Selected /Applications/Xcode_$XCODE_VERSION.app"
            sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          else
            echo "Xcode $XCODE_VERSION not found, searching available Xcode versions..."
            LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -n 1)
            if [ -n "$LATEST_XCODE" ]; then
              echo "Selected $LATEST_XCODE"
              sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
            fi
          fi
          xcode-select -p

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared/bazel-cache /Users/Shared/bazel-repo-cache
          sudo chown -R $(whoami) /Users/Shared
          mkdir -p /Users/Shared/telegram-ios
          rsync -a --delete --exclude='.git/modules' $GITHUB_WORKSPACE/ /Users/Shared/telegram-ios/
          cd /Users/Shared/telegram-ios
          chmod -R +x build-system
          chmod -R +x submodules/ffmpeg/Sources/FFMpeg
          find . -type f \( -name "*.sh" -o -name "*.py" -o -name "*.pl" -o -name "configure" -o -name "pkg-config" \) -exec chmod +x {} + || true

      - name: Build the App
        run: |
          set -x

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset 2>/dev/null || echo 0)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 1)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="/Users/Shared/bazel-cache" \
            --bazelArguments="--repository_cache=/Users/Shared/bazel-repo-cache" \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --configurationPath="build-system/burmalgram-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="build/artifacts"

          # ensure Burmalgram.ipa exists
          cd $SOURCE_DIR
          if [ -f "build/artifacts/Swiftgram.ipa" ]; then
            cp "build/artifacts/Swiftgram.ipa" "build/artifacts/Burmalgram.ipa"
          fi

          if [ ! -f "build/artifacts/Burmalgram.ipa" ]; then
            echo "Searching for built IPA..."
            FOUND_IPA=$(find bazel-bin bazel-out build -name "*.ipa" | head -n 1)
            if [ -n "$FOUND_IPA" ]; then
              echo "Found $FOUND_IPA"
              mkdir -p build/artifacts
              cp "$FOUND_IPA" build/artifacts/Burmalgram.ipa
            else
              echo "Error: No IPA found!"
              exit 1
            fi
          fi

          echo "Burmalgram.ipa successfully built:"
          ls -lh build/artifacts/Burmalgram.ipa

      - name: Inject TGExtra Tweak into Burmalgram IPA
        run: |
          set +e
          echo "Installing Cyan CLI for tweak injection..."
          brew install cyan || pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip || python3 -m pip install --break-system-packages --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip || true
          
          IPA_PATH="/Users/Shared/telegram-ios/build/artifacts/Burmalgram.ipa"
          OUT_IPA="/Users/Shared/telegram-ios/build/artifacts/Burmalgram-TGExtra.ipa"
          DYLIB_PATH="/Users/Shared/telegram-ios/build-system/tweaks/TGExtra.dylib"
          DEB_PATH="/Users/Shared/telegram-ios/build-system/tweaks/com.choco.tg_1.2.1_iphoneos-arm64.deb"
          BUNDLE_PATH="/Users/Shared/telegram-ios/build-system/tweaks/TGExtra.bundle"
          
          if command -v cyan >/dev/null 2>&1 && [ -f "$IPA_PATH" ]; then
            if [ -f "$DYLIB_PATH" ] && [ -d "$BUNDLE_PATH" ]; then
              echo "Injecting TGExtra.dylib and TGExtra.bundle into IPA via Cyan..."
              cyan -i "$IPA_PATH" -o "$OUT_IPA" -u -w -s -g -f "$DYLIB_PATH" "$BUNDLE_PATH"
            elif [ -f "$DEB_PATH" ]; then
              echo "Injecting TGExtra deb into IPA via Cyan..."
              cyan -i "$IPA_PATH" -o "$OUT_IPA" -u -w -s -g -f "$DEB_PATH"
            fi
            
            if [ -f "$OUT_IPA" ]; then
              echo "TGExtra tweak successfully injected into Burmalgram.ipa!"
              mv "$OUT_IPA" "$IPA_PATH"
            else
              echo "Cyan injection produced no output file; keeping compiled Burmalgram.ipa"
            fi
          else
            echo "Cyan CLI not available or IPA missing, skipping tweak injection."
          fi
          ls -lh "$IPA_PATH"

      - name: Save Bazel Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            /Users/Shared/bazel-cache
            /Users/Shared/bazel-repo-cache
          key: bazel-${{ runner.os }}-${{ github.run_id }}

      - name: Upload Burmalgram IPA Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Burmalgram-${{ env.APP_VERSION }}-build${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Burmalgram.ipa

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: v${{ env.APP_VERSION }}-b${{ env.BUILD_NUMBER }}
          name: Burmalgram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Clean Burmalgram build for iOS (Telegram ${{ env.APP_VERSION }}).
            Features:
            - TGExtra integration (Location spoofing, Ghost mode, Anti-ads, Saving protected media, Language selector)
            - GGPlugin system (IDE, JS runtime, GGAPI scripts, custom plugins)
            - Ghost Mode (hide online, read receipts, typing status, story views)
            - Anti-Delete (deleted messages retention)
            - Device Spoofing & Voice Morpher
            - No-Save bypass (download restricted media)
            - Channel ad-block (sponsored messages blocked)
            - Custom icons: Default Cat Icon + Dark Premium Stars
          files: /Users/Shared/telegram-ios/build/artifacts/Burmalgram.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

