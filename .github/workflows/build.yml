name: Build Burmalgram

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          else
            echo "Xcode $XCODE_VERSION not found, using default Xcode"
            xcode-select -p
          fi

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset 2>/dev/null || echo 0)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 1)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" $OUTPUT_PATH/Burmalgram.ipa
          done

      - name: Upload Burmalgram IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Burmalgram-${{ env.APP_VERSION }}-build${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Burmalgram.ipa

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ env.APP_VERSION }}-b${{ env.BUILD_NUMBER }}
          name: Burmalgram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Clean Burmalgram build for iOS (Telegram ${{ env.APP_VERSION }}).
            Features:
            - Ghost Mode (hide online, read receipts, typing status)
            - Anti-Delete (deleted messages retention)
            - Device Spoofing
            - Voice Morpher
            - No-Save bypass (download restricted media)
            - Channel ad-block (kGetSponsoredMessages blocked)
            - Custom icons: Default Cat Icon + Dark Premium Stars
          files: /Users/Shared/telegram-ios/build/artifacts/Burmalgram.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
